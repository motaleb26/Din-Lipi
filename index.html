p{margin:0}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.ic{flex:none;display:block}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .sub{color:var(--muted);font-size:.9rem}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);padding:4px 0;margin-bottom:6px;font-weight:600}
.langbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.85rem;min-height:36px;white-space:nowrap}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;padding-top:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--warn)} .sync.err i{background:var(--bad)}

.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 0}
.sec h2{font-size:1rem}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}

.big{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.1}
.label{font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.hero .label{color:inherit;opacity:.8}

.pr{border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;min-height:56px}
.pr b{font-weight:600}
.pr.done{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.amt{font-weight:600;white-space:nowrap}
.amt.out{color:var(--bad)} .amt.in{color:var(--good)}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--surface);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{text-align:center;color:var(--muted);padding:20px 8px}

.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.cat .bar{grid-column:1/-1}
.dots{display:flex;gap:6px}

.tile b{font-family:var(--f-display);font-weight:600}
.tile span{font-size:.82rem;color:var(--muted)}

.scrim{position:absolute;inset:0;background:rgba(8,12,18,.55)}
.panel{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.82rem;color:var(--muted);font-weight:500}

.row-btns{display:flex;gap:12px}
.row-btns .btn{flex:1}
.err{color:var(--bad);font-size:.88rem}

.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;color:var(--muted);min-height:40px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px;min-height:46px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:30;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
svg text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

/* ---------- prayer times ---------- */
const rad=Math.PI/180;
const sinD=a=>Math.sin(a*rad),cosD=a=>Math.cos(a*rad),tanD=a=>Math.tan(a*rad);
const asinD=x=>Math.asin(x)/rad,acosD=x=>Math.acos(x)/rad,atan2D=(y,x)=>Math.atan2(y,x)/rad,acotD=x=>Math.atan(1/x)/rad;
const fixA=a=>{a=a-360*Math.floor(a/360);return a};
const fixH=h=>{h=h-24*Math.floor(h/24);return h};
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){
  const D=jd-2451545.0,g=fixA(357.529+0.98560028*D),q=fixA(280.459+0.98564736*D);
  const L=fixA(q+1.915*sinD(g)+0.020*sinD(2*g)),e=23.439-0.00000036*D;
  const RA=atan2D(cosD(e)*sinD(L),cosD(L))/15;
  return {decl:asinD(sinD(e)*sinD(L)),eqt:q/15-fixH(RA)};
}
function prayerTimes(y,m,d){
  const st=S.settings,lat=st.lat,lng=st.lng,tz=st.tz;
  const jd=julian(y,m,d)-lng/(15*24);
  const sp=t=>sunPos(jd+t/24);
  const mid=t=>fixH(12-sp(t).eqt);
  const ang=(a,t,ccw)=>{const dc=sp(t).decl;const v=acosD((-sinD(a)-sinD(dc)*sinD(lat))/(cosD(dc)*cosD(lat)))/15;return mid(t)+(ccw?-v:v)};
  const asr=(f,t)=>{const dc=sp(t).decl;return ang(-acotD(f+tanD(Math.abs(lat-dc))),t,false)};
  const fa=st.method==='karachi'?18:18.5;
  let T={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18};
  for(let i=0;i<2;i++){
    T={fajr:ang(fa,T.fajr,true),sunrise:ang(0.833,T.sunrise,true),dhuhr:mid(T.dhuhr),asr:asr(st.asr==2?2:1,T.asr),maghrib:ang(0.833,T.maghrib,false)};
  }
  const adj=tz-lng/15;
  const R={};
  Object.keys(T).forEach(k=>{R[k]=T[k]+adj});
  R.isha=st.method==='karachi'?ang(18,18,false)+adj:R.maghrib+1.5;
  return R;
}
function hm(h){
  let m=Math.round(fixH(h)*60);
  let hh=Math.floor(m/60)%24,mm=m%60;
  const ap=hh>=12?'PM':'AM';hh=hh%12;if(hh===0)hh=12;
  return hh+':'+pad(mm)+' '+ap;
}
const PR=[['fajr',tt('ফজর')],['dhuhr',tt('যোহর')],['asr',tt('আসর')],['maghrib',tt('মাগরিব')],['isha',tt('এশা')]];
function nextPrayer(){
  const now=Date.now(),tz=S.settings.tz;
  for(let off=0;off<2;off++){
    const ds=addDays(today(),off),p=ds.split('-').map(Number),T=prayerTimes(p[0],p[1],p[2]);
    for(const k of PR){const at=Date.UTC(p[0],p[1]-1,p[2])+(T[k[0]]-tz)*3600000;if(at>now)return {k:k[0],name:k[1],at:at,h:T[k[0]]}}
  }
  return null;
}
function untilText(at){
  const mins=Math.max(0,Math.round((at-Date.now())/60000)),h=Math.floor(mins/60),m=mins%60;
  return (h?h+tt(' ঘণ্টা '):'')+m+tt(' মিনিট বাকি');
}

/* vault */
const V={key:null,salt:null,list:[],open:false};
const enc=new TextEncoder(),dec=new TextDecoder();
function b64(u){let s='';u.forEach(b=>{s+=String.fromCharCode(b)});return btoa(s)}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
const hasCrypto=()=>!!(window.crypto&&window.crypto.subtle);
async function vKey(pin,salt){
  const km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function vaultSave(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},V.key,enc.encode(JSON.stringify(V.list)));
  S.vault={salt:b64(V.salt),iv:b64(iv),ct:b64(new Uint8Array(ct))};
  commitQuiet();
}
async function vaultCreate(pin){V.salt=crypto.getRandomValues(new Uint8Array(16));V.key=await vKey(pin,V.salt);V.list=[];V.open=true;await vaultSave()}
async function vaultUnlock(pin){
  const v=S.vault,salt=unb64(v.salt),key=await vKey(pin,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},key,unb64(v.ct));
  V.list=JSON.parse(dec.decode(pt));V.key=key;V.salt=salt;V.open=true;
}
function vaultLock(){V.key=null;V.salt=null;V.list=[];V.open=false;reveal={}}
function vVault(){

  }else if(!V.open){
    h+=tt('<div class="card stack"><h2>ভল্ট তালাবদ্ধ</h2><p class="muted">পিন দিয়ে খুলুন।</p><button class="btn primary block" data-act="vault-unlock">')+ic('lock',18)+tt('খুলুন</button><button class="link" data-act="vault-reset" style="text-align:left">পিন ভুলে গেছি, ভল্ট মুছে নতুন করব</button></div>');

function spark(arr){
  if(arr.length<2)return '';
  const v=arr.map(a=>a.kg),mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),r=(mx-mn)||1,W=300,H=80,px=14;
  const pts=v.map((x,i)=>[px+i*(W-2*px)/(v.length-1),H-16-(x-mn)/r*(H-34)]);
  const last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+tt('" width="100%" role="img" aria-label="ওজনের পরিবর্তন"><polyline points="')+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5" fill="var(--accent)"/><text x="'+px+'" y="'+(H-2)+'">'+fmt(mn)+tt(' কেজি</text><text x="')+(W-px)+'" y="10" text-anchor="end">'+fmt(mx)+tt(' কেজি</text></svg>');
}

  backup(){
    try{const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=u;a.download='dinlipi-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(tt('ব্যাকআপ ফাইল তৈরি হয়েছে'))}
    catch(e){toast(tt('ব্যাকআপ নামানো যায়নি'))}
  },
  async 'backup-copy'(){try{await navigator.clipboard.writeText(JSON.stringify(S));toast(tt('ব্যাকআপ কপি হয়েছে, কোথাও পেস্ট করে রাখুন'))}catch(e){toast(tt('কপি করা যায়নি'))}},
  'restore-paste'(){openSheet(tt('লেখা থেকে ফেরান'),area(tt('কপি করা ব্যাকআপ এখানে পেস্ট করুন'),'txt','',8),o=>{try{const j=JSON.parse(o.txt||'');if(!j||!Array.isArray(j.expenses))throw 0;vaultLock();S=merge(j);commit();toast(tt('তথ্য ফেরত এসেছে'))}catch(x){sheetErr(tt('লেখাটি ঠিক নয়'));return false}})},
  restore(){$('#restoreIn').click()},
  wipe(){openSheet(tt('সব তথ্য মুছবেন?'),tt('<p class="muted">খরচ, নোট, অভ্যাস, ভল্টসহ সব তথ্য এই অ্যাপ থেকে মুছে যাবে। আগে ব্যাকআপ নিয়ে রাখুন।</p>'),()=>{vaultLock();S=DEF();commit();sub=null;tab='home';render()})},
  'vault-create'(){openSheet(tt('ভল্টের পিন'),tt('<p class="muted small">অন্তত ৪ অঙ্ক। পিন ভুললে তথ্য ফেরত আসবে না।</p>')+fld(tt('পিন'),'pin','','password','inputmode="numeric" autocomplete="new-password" required')+fld(tt('আবার লিখুন'),'pin2','','password','inputmode="numeric" autocomplete="new-password" required'),o=>{
      if((o.pin||'').length<4){sheetErr(tt('পিন কমপক্ষে ৪ অঙ্কের হতে হবে'));return false}
      if(o.pin!==o.pin2){sheetErr(tt('দুইবারের পিন মেলেনি'));return false}
      return vaultCreate(o.pin).then(()=>{render()}).catch(()=>{sheetErr(tt('ভল্ট তৈরি করা যায়নি'));return false})})},
  'vault-unlock'(){openSheet(tt('ভল্ট খুলুন'),fld(tt('পিন'),'pin','','password','inputmode="numeric" autocomplete="current-password" required'),o=>vaultUnlock(o.pin||'').then(()=>{render()}).catch(()=>{sheetErr(tt('পিন ভুল'));return false}))},
  'vault-reset'(){openSheet(tt('ভল্ট মুছবেন?'),tt('<p class="muted">সব পাসওয়ার্ড এন্ট্রি মুছে যাবে এবং নতুন পিন দিয়ে শুরু করতে হবে।</p>'),()=>{vaultLock();S.vault=null;commit()})},
  'vault-lock'(){vaultLock();render()},
  'vault-add'(){sheetVaultEntry()},
  'vault-edit'(el){sheetVaultEntry(find(V.list,el.dataset.id))},
  'vault-show'(el){const id=el.dataset.id;reveal[id]=!reveal[id];render()},
  async 'vault-copy'(el){const e=find(V.list,el.dataset.id);if(!e)return;try{await navigator.clipboard.writeText(e.pass);toast(tt('পাসওয়ার্ড কপি হয়েছে'))}catch(x){reveal[e.id]=true;render();toast(tt('কপি হয়নি, দেখে নিন'))}}
};
function sheetOT(x){
  const v=x||{date:today()};
  openSheet(x?tt('ওভারটাইম বদলান'):tt('ওভারটাইম যোগ'),fld(tt('তারিখ'),'date',v.date,'date','required')+money(tt('কত ঘণ্টা'),'hrs',v.hrs),
    o=>{const h=num(o.hrs);if(!(h>0))return false;const n={date:o.date||today(),hrs:h};if(x)Object.assign(x,n);else S.otlog.push(Object.assign({id:uid()},n));commit()},
    x?()=>{S.otlog=S.otlog.filter(z=>z.id!==x.id);commit();closeSheet()}:null);
}
function quickAdd(){
  openSheet(tt('কী যোগ করবেন?'),tt('<div class="stack"><button type="button" class="btn block" data-act="q-exp">খরচ লিখুন</button><button type="button" class="btn block" data-act="q-task">নতুন কাজ</button><button type="button" class="btn block" data-act="q-note">নোট লিখুন</button><button type="button" class="btn block" data-act="q-water">এক গ্লাস পানি</button></div>'),()=>{});
  const f=$('#sheetForm');$('.row-btns',f).hidden=true;
}
ACT['q-exp']=()=>{closeSheet();sheetExp()};
ACT['q-task']=()=>{closeSheet();sheetTask()};
ACT['q-note']=()=>{closeSheet();sheetNote()};
ACT['q-water']=()=>{closeSheet();ACT.water({dataset:{n:1}})};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const f=ACT[el.dataset.act];
  if(f){if(el.type==='button'||el.tagName==='BUTTON')e.preventDefault();f(el)}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='shopForm'){
    e.preventDefault();const i=$('#shopIn'),n=i.value.trim();if(!n)return;
    S.shop.push({id:uid(),name:n,done:false});commit();const j=$('#shopIn');if(j)j.focus();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='noteSearch'){const q=t.value.trim().toLowerCase();$$('.note-item').forEach(n=>{n.hidden=!!q&&n.dataset.q.indexOf(q)<0})}
  if(t.id==='fxA'){$('#fxB').value=+(num(t.value)*S.settings.rate).toFixed(2)}
  if(t.id==='fxB'){$('#fxA').value=+(num(t.value)/S.settings.rate).toFixed(2)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='restoreIn'){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!Array.isArray(o.expenses))throw 0;vaultLock();S=merge(o);commit();toast(tt('তথ্য ফেরত এসেছে'))}catch(x){toast(tt('ফাইলটি ঠিক নয়'))}};
    r.readAsText(f);e.target.value='';
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&V.open){vaultLock();if(sub==='vault')render()}});
setInterval(()=>{if(tab==='home'&&$('#sheet').hidden)render()},30000);

render();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body>
</html>
